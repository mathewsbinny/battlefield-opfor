# Project OPFOR — Unified 4-Mode Configuration (BFBC1, BFBC2, BF1943, Vietnam)

[paths]
engine = "engine"
modules = "modules"
cache = "cache"
user = "user"
ledger = "ledger"

[hub]
enabled = true
theme = "tool-suite-dark"
default_blade = "bfbc2"

[vfs]
enabled = true
log_redirects = false
merge_package_mft = true

[modes]
bfbc2 = true
vietnam = true
bf1943 = true
bfbc1 = true

[bfbc1]
allow_fifth_kit = true
disable_health_regen = true

[patches]
offline_network_guard = true
vietnam_offline_unlock = true

[input]
normalize_controls = true
controller_support = true
auto_prompt_switch = true

[vo]
multikill_count = 3
multikill_window_ms = 5000

[dev]
force_ai = false
sector_offsets = ""
unit_counters_dump = false
unit_counters_interval_s = 60

[debug]
log_level = "info"
vo_probe = false
kill_probe = false
