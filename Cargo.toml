[workspace]
resolver = "2"
members = [
    "crates/opfor-vfs",
    "crates/opfor-apt",
    "crates/opfor-dll",
    "crates/opfor-host",
    "crates/opfor-launcher",
    "crates/opfor-cli",
    "crates/opfor-setup",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = false
